agent:
  default_mode: rule
  llm_provider_env: DIAGNOSIS_AGENT_PROVIDER
  llm_model_env: DIAGNOSIS_AGENT_MODEL
  llm_api_key_env: DIAGNOSIS_AGENT_API_KEY
  llm_base_url_env: DIAGNOSIS_AGENT_BASE_URL
document_agent:
  llm_provider_env: DOCUMENT_AGENT_PROVIDER
  llm_model_env: DOCUMENT_AGENT_MODEL
  llm_api_key_env: DOCUMENT_AGENT_API_KEY
  llm_base_url_env: DOCUMENT_AGENT_BASE_URL
diagnosis:
  stages: [created, detecting, evidence_collecting, retrieving_knowledge, reasoning, reporting, completed]